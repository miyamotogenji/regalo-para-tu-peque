name: Publish todosabordocr.com

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe hosting from GitHub runner
        run: |
          set -e
          echo "Runner IP:" $(curl -s https://api.ipify.org)
          curl -sI --max-time 20 http://todosabordocr.com/wp-login.php | head -5
          curl -s --max-time 20 http://todosabordocr.com/wp-json/ | head -c 200; echo

      - name: Try WordPress REST publish
        run: python wp_publish_all.py | tee publish.log

      - name: Try WordPress XML-RPC publish
        continue-on-error: true
        run: python wp_xmlrpc_publish.py | tee -a publish.log

      - name: Try FTP static upload (P2/P3 folders)
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          printf '%s\n' '<?php' 'return [' "  'api_key' => '${BREVO_API_KEY}'," '];' > wordpress-publish/el-poder-de-ser-yo/brevo-config.php
          for cred in "hola@todosabordocr.com:Lorenzo160384.." "hola:Lorenzo160384.." "todosabordocr:Carmen160384.." "todosabordocr:@w@xQcxN\$v3STlcn"; do
            user="${cred%%:*}"; pass="${cred#*:}"
            echo "FTP try user=$user"
            lftp -u "$user,$pass" ftp.todosabordocr.com -e "\
            set ssl:verify-certificate no; \
            pwd; ls; \
            cd public_html || cd www || cd htdocs || cd .; \
            pwd; ls; \
            mirror -R wordpress-publish/un-regalo-para-tu-peque un-regalo-para-tu-peque; \
            mirror -R wordpress-publish/el-poder-de-ser-yo el-poder-de-ser-yo; \
            bye" && break
          done

      - name: Upload publish log
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: publish.log
